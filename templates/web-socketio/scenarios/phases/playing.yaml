# TODO: アプリに合わせて書き換える（ひな形。元は halpal の検証用リポジトリ）
# 局面 playing：alice と bob が対局中。選択を求められている方が current_player。eve は部外者、anon は未登録
version: 1
name: phase-playing
steps:
  - include: { file: two-players-start.yaml }
  - connect: { user: eve }
  - emit: { user: eve, event: registPlayer, args: [{ name: "eve-{run}" }], save: { eve_token: "$[0].reconnectToken" } }
  - connect: { user: anon }
  - whose_turn: { users: [alice, bob], save_current: current, save_other: other, timeout_ms: 20000 }
  - set: { actors: { current_player: "{current}", other_player: "{other}", outsider: eve, anonymous: anon } }
