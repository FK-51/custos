# TODO: アプリに合わせて書き換える（ひな形。元は halpal の検証用リポジトリ）
# 利用者を1人登録する（秘密の値の推測しにくさの検査で、続けて何度も実行する）。{user} と {name} はフレームワークが渡す
version: 1
name: register
steps:
  - connect: { user: "{user}" }
  - emit: { user: "{user}", event: registPlayer, args: [{ name: "{name}" }], ack: true }
  - disconnect: { user: "{user}" }
